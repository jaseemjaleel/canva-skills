name: ChatGPT & Codex Plugin Autopilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analyze repository with Plugin Autopilot
        uses: imMamdouhaboammar/chatgpt-codex-plugin-autopilot@v0.8.0
        with:
          path: .
          action: analyze
          fail-on-error: 'true'
          summary: 'true'
